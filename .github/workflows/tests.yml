name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
      - run: uv sync --frozen
      - run: PYTHONPATH=src uv run pytest
      - run: Rscript tests/test_hc3.R
