[project]
name = "hbcd-hdp-infant-brain"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "nibabel>=5.2",
    "nilearn>=0.11",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-docx>=1.1",
    "scipy>=1.12",
    "statsmodels>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["python", "prepare"]

[tool.coverage.report]
fail_under = 98
show_missing = true

[dependency-groups]
dev = [
    "air-formatter>=0.12.0",
    "black>=26.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# avoids errors due to black running in 3.14
[tool.black]
target-version = ["py311"]
