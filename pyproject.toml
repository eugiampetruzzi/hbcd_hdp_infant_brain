[project]
name = "hbcd-hdp-infant-brain"
version = "0.1.0"
description = "Reproducible imaging derivation and statistical analysis for the HBCD hypertensive disorders of pregnancy study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nibabel==5.3.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "python-dotenv==1.0.1",
    "scipy==1.14.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbcd_hdp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
